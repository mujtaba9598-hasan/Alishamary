<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Alisha Mary Fisheries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="nav-container container">
            <a href="index.html" class="logo">
                <img src="assets/logo.jpg" alt="Alisha Mary Fisheries Logo" style="height: 90px; width: auto; object-fit: contain;">
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop Gear</a>
                <a href="gallery.html">Gallery</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="book.html" class="btn btn-primary btn-sm">Book Consultation</a>
            </nav>
        </div>
    </header>

    <main class="container contact-page" style="padding: var(--spacing-lg) 0;">
        <div class="grid-12">
            <div class="col-6">
                <h1>Ready to Upgrade Your Gear?</h1>
                <p class="lead-text">Send us a quick note to discuss custom specifications, bulk orders, or pricing.</p>
                <div style="margin-top: 3rem;">
                    <h4>Email</h4>
                    <p>info@alishamaryfisheries.com</p>
                    <br>
                    <h4>Phone</h4>
                    <p>+353 ___________</p>
                    <br>
                    <h4>Location</h4>
                    <p>Malin, County Donegal, Ireland</p>
                </div>
            </div>
            <div class="col-6 checkout-form" style="background: var(--clr-bg-alt); padding: 3rem; border: 1px solid var(--clr-accent);">
                <form>
                    <div class="form-row">
                        <input type="text" placeholder="First Name" required>
                        <input type="text" placeholder="Last Name" required>
                    </div>
                    <input type="email" placeholder="Email Address" required>
                    <input type="tel" placeholder="Phone Number">
                    <textarea placeholder="Message" rows="5" style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid var(--clr-accent); font-family: var(--font-body);"></textarea>
                    
                    <label style="font-size: 0.85rem; display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem;">
                        <input type="checkbox" style="width: auto; margin: 0;"> Send me a gear catalog
                    </label>

                    <button type="submit" class="btn btn-primary block-btn">SUBMIT INQUIRY</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="app.js"></script>

    <!-- Floating Contact Menu -->
    <div class="floating-contact-menu">
        <a href="mailto:info@alishamaryfisheries.com" class="floating-btn email-btn" title="Email Us">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </a>
        <a href="tel:+353000000000" class="floating-btn call-btn" title="Call Us">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </a>
        <a href="https://wa.me/971527529598" class="floating-btn wa-btn" title="WhatsApp Us" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        </a>
    </div>

</body>
</html>
