<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Alisha Mary Fisheries Ltd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
</head>
<body>
    <header class="main-header" style="border-bottom: none;">
        <div class="nav-container container" style="justify-content: center;">
            <a href="index.html" class="logo">Alisha Mary Fisheries Ltd</a>
        </div>
    </header>

    <main class="container checkout-page">
        <div class="grid-12">
            <div class="col-7 checkout-form">
                <h2>Contact Information</h2>
                <input type="email" placeholder="Email address" required>
                
                <h2>Shipping Address</h2>
                <div class="form-row">
                    <input type="text" placeholder="First name">
                    <input type="text" placeholder="Last name">
                </div>
                <input type="text" placeholder="Company (optional)">
                <input type="text" placeholder="Address">
                <input type="text" placeholder="City">
                <div class="form-row">
                    <select>
                        <option>Ireland</option>
                        <option>United Kingdom</option>
                        <option>Europe</option>
                    </select>
                    <input type="text" placeholder="Postal code">
                </div>

                <a href="#" class="btn btn-primary" style="margin-top: 2rem;">CONTINUE TO PAYMENT</a>
            </div>
            
            <div class="col-5 checkout-summary">
                <div class="cart-item checkout-item">
                    <img src="assets/commercial-lobster-pots-1.jpg" alt="Item" width="60">
                    <div>
                        <h4 style="font-size: 0.9rem;">Lobster Parlour Pot</h4>
                        <p style="font-size: 0.8rem;">Qty: 1</p>
                    </div>
                    <span>&euro;100.00</span>
                </div>
                <hr>
                <div class="summary-line"><span>Subtotal</span><span>&euro;100.00</span></div>
                <div class="summary-line"><span>Shipping</span><span>&euro;15.00</span></div>
                <hr>
                <div class="summary-line total"><span>Total</span><span>&euro;115.00</span></div>
            </div>
        </div>
    </main>

    <!-- Floating Contact Menu -->
    <div class="floating-contact-menu">
        <a href="mailto:info@alishamaryfisheries.com" class="floating-btn email-btn" title="Email Us">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </a>
        <a href="tel:0877548052" class="floating-btn call-btn" title="Call Us">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </a>
        <a href="https://wa.me/971527529598" class="floating-btn wa-btn" title="WhatsApp Us" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        </a>
    </div>

</body>
</html>
